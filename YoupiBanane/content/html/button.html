<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Red Button Test</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 3em;
    }
    button {
      background-color: #c00;
      color: white;
      border: none;
      padding: 1em 2em;
      font-size: 1.2em;
      border-radius: 0.5em;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #900;
    }
  </style>
</head>
<body>
  <h1 id="status">Press the button</h1>
  <button onclick="document.getElementById('status').textContent = 'Button pressed!'">
    Click Me
  </button>
</body>
</html>
