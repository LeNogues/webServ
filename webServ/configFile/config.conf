server {
	listen 0.0.0.0:8001

	server_name weebserv

	root /home/adoireau/proj/webServ/webServ/YoupiBanane

	autoindex off
	index Makefile

	allow_methods POST DELETE
	client_max_body_size 10
	cgi_param   hello world
}

server    {
	listen 127.0.0.1:8081


	root /home/sle-nogu/Documents/webServGit/webServ/YoupiBanane

	server_name YoupiBanane
	error_page 400 error_pages/400.html

	allow_methods GET POST

	autoindex off
	index index.html

	client_max_body_size 1000000
	cgi_param   hello world

	location /test {
		location /test/test2 {
			return 404 merci
		}
		return 301 /index.html
	}
	location /cgi-bin {
		cgi_param firstName John
		cgi_param lastName Doe
	}
}

server {
	server_name youpi
	listen 8080

	root /home/sle-nogu/Documents/webServGit/webServ/YoupiBanane
	index index.html
	autoindex on

	allow_methods GET POST DELETE

	location /image {
		alias /home/sle-nogu/Pictures
		location /image/test {
			allow_methods GET POST
		}
	}
	location /put_test {
		allow_methods PUT
	}

	location /post_body {
		allow_methods GET POST
		client_max_body_size 1000000
		cgi_param lastName Doe1
		alias /home/adoireau/post_body
		location /post_body/test {
			allow_methods GET
			error_page 404 error_pages/404.html
			cgi_param firstName John2
			cgi_param lastNames Doe2
		}
	}

	location /directory {
		allow_methods GET
		index youpi.bad_extension
	}
}
