<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Red Button Counter</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 3em;
    }

    #count {
      font-size: 1.5em;
      margin-bottom: 1.5em;
    }

    button {
      background-color: #c00;
      color: white;
      border: none;
      padding: 1em 2em;
      font-size: 1.2em;
      border-radius: 0.5em;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #900;
    }
  </style>
</head>
<body>
  <h1 id="count">Pressed 0 times</h1>
  <button id="red-button">Click Me</button>

  <script>
    let count = 0;
    const button = document.getElementById('red-button');
    const display = document.getElementById('count');

    button.onclick = function() {
      count++;
      display.textContent = "Pressed " + count + " time" + (count === 1 ? "" : "s");
    };
  </script>
</body>
</html>
