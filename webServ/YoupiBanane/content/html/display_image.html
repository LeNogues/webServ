<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Red Button Show Image</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 3em;
    }

    button {
      background-color: #c00;
      color: white;
      border: none;
      padding: 1em 2em;
      font-size: 1.2em;
      border-radius: 0.5em;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-bottom: 2em;
    }

    button:hover {
      background-color: #900;
    }

    img {
      max-width: 80%;
      height: auto;
      display: none; /* hidden until button is pressed */
      border: 2px solid #c00;
      border-radius: 0.5em;
    }
  </style>
</head>
<body>
  <button id="red-button">Click Me</button>
  <div>
    <img id="display-image" src="" alt="Loaded image">
  </div>

  <script>
    const button = document.getElementById('red-button');
    const img = document.getElementById('display-image');

    button.onclick = function() {
      img.src = "../png/travolta.png"; // replace with your PNG filename
      img.style.display = "block";
    };
  </script>
</body>
</html>
