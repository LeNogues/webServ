<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Webserv</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header class="main-header">
			<div class="title">
				<h1>Webserv</h1>
			</div>
			<div class="collaborator">
				<h2>Arthur Doireau</h2>
				<h2>Sebastien Le Nogues</h2>
				<h2>Walter Beschon</h2>
			</div>
		</header>
		<main>
			<div class="cards-zone">
				<div class="GET Card">
					<h3 class="title-card">GET</h3>
					<p class="text-card">Get file from server</p>
					<input type="text" id="getFileInput" placeholder="Chemin du fichier (ex: /index.html)">
					<button id="getButton" class="method-button">GET</button>
					<div id="getStatusMessage"></div>
				</div>

				<div class="POST Card">
					<h3 class="title-card">POST</h3>
					<p class="text-card">Post file to server</p>
					
					<form id="uploadForm" enctype="multipart/form-data">
						<input type="file" name="monFichier" id="monFichier" required>
						<button type="submit" class="method-button">POST</button>

						<div id="statusMessagePost"></div>
					</form>
				</div>

				<div class="DELETE Card">
					<h3 class="title-card">DELETE</h3>
					<p class="text-card">Delete file from server</p>
					<input type="text" id="deleteFileInput" placeholder="Chemin du fichier (ex: /test.txt)">
					<button id="deleteButton" class="method-button">DELETE</button>

					<div id="statusMessageDelete"></div>
				</div>
			</div>

			<section id="getResultSection">
				<h3>Résultat du GET</h3>
				<iframe id="getResultFrame" style="width:100%;height:400px;border:1px solid #ccc;"></iframe>
			</section>
		</main>

		<footer class="main-footer">
			<h6>Maybe a footer wasn't necessary...</h6>
		</footer>

		<script src="app.js"></script>
	</body>
</html>
